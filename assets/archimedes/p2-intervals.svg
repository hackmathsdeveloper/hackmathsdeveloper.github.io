<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Nested intervals converging to four thirds</title>
<desc id="dsc">Six rows showing the inscribed sums 1, 5/4, 21/16, 85/64, 341/256, 1365/1024 approaching 4/3 with exact gaps.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b9c4d8"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#00adb5"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#f07178"/></marker>
  <marker id="dim" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,4 L7,4" stroke="#b9c4d8" stroke-width="1.4"/></marker>
  <pattern id="hatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="9" stroke="#f07178" stroke-width="2.2" opacity="0.55"/>
  </pattern>
  <style>
    text { font-family: 'Source Sans Pro','Helvetica Neue',Arial,sans-serif; fill: #eaeaea; }
    .ttl { font-size: 20px; font-weight: 600; fill: #ffffff; }
    .sub { font-size: 14px; fill: #b9c4d8; }
    .lbl { font-size: 17px; fill: #eaeaea; }
    .sml { font-size: 14px; fill: #b9c4d8; }
    .eq  { font-size: 17px; fill: #ffcb6b; }
    .axis { stroke: #7c89a6; stroke-width: 1.5; fill: none; }
    .grid { stroke: #3a455c; stroke-width: 1; fill: none; }
    .curve { stroke: #00adb5; stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { stroke: #f78c6c; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .curve3 { stroke: #82aaff; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: #eaeaea; stroke-width: 1.5; fill: none; stroke-linejoin: round; }
    .thin2 { stroke: #b9c4d8; stroke-width: 1.2; fill: none; }
    .dash { stroke-dasharray: 7 6; }
    .dotdash { stroke-dasharray: 2 6; }
    .fill-teal { fill: #00adb5; fill-opacity: 0.16; }
    .fill-orange { fill: #f78c6c; fill-opacity: 0.15; }
    .fill-blue { fill: #82aaff; fill-opacity: 0.12; }
    .fill-purple { fill: #c792ea; fill-opacity: 0.14; }
    .fill-green { fill: #c3e88d; fill-opacity: 0.12; }
    .fill-red { fill: #f07178; fill-opacity: 0.12; }
    .pt { fill: #eaeaea; }
    .pt-teal { fill: #00adb5; }
    .pt-orange { fill: #f78c6c; }
    .box { fill: #1f2430; stroke: #3a455c; stroke-width: 1.2; }
  </style>
</defs>
<rect x="0" y="0" width="1000" height="520" rx="14" fill="#252a34"/>
<line x1="160.0" y1="131.0" x2="690.0" y2="131.0" class="axis"/>
<line x1="224.6" y1="125.0" x2="224.6" y2="137.0" class="axis"/>
<text x="224.6" y="115.0" class="sml" text-anchor="middle">1</text>
<line x1="353.9" y1="125.0" x2="353.9" y2="137.0" class="axis"/>
<text x="353.9" y="115.0" class="sml" text-anchor="middle">1.1</text>
<line x1="483.2" y1="125.0" x2="483.2" y2="137.0" class="axis"/>
<text x="483.2" y="115.0" class="sml" text-anchor="middle">1.2</text>
<line x1="612.4" y1="125.0" x2="612.4" y2="137.0" class="axis"/>
<text x="612.4" y="115.0" class="sml" text-anchor="middle">1.3</text>
<line x1="655.5" y1="121.0" x2="655.5" y2="425.0" class="thin2 dash"/>
<text x="663.5" y="115.0" class="eq" text-anchor="start">K = 4/3</text>
<text x="52.0" y="170.0" class="lbl" text-anchor="start">n = 0</text>
<rect x="224.63" y="154" width="430.89" height="22" fill="#00adb5" fill-opacity="0.55" stroke="#00adb5" stroke-width="1"/>
<rect x="224.63" y="154" width="4" height="22" fill="#ffffff"/>
<text x="720.0" y="170.0" class="sml" text-anchor="start">Sₙ = 1</text>
<text x="850.0" y="170.0" class="sml" text-anchor="start" fill="#ffcb6b">gap = 1/3</text>
<text x="52.0" y="218.0" class="lbl" text-anchor="start">n = 1</text>
<rect x="547.80" y="202" width="107.72" height="22" fill="#00adb5" fill-opacity="0.55" stroke="#00adb5" stroke-width="1"/>
<rect x="547.80" y="202" width="4" height="22" fill="#ffffff"/>
<text x="720.0" y="218.0" class="sml" text-anchor="start">Sₙ = 5/4</text>
<text x="850.0" y="218.0" class="sml" text-anchor="start" fill="#ffcb6b">gap = 1/12</text>
<text x="52.0" y="266.0" class="lbl" text-anchor="start">n = 2</text>
<rect x="628.60" y="250" width="26.93" height="22" fill="#00adb5" fill-opacity="0.55" stroke="#00adb5" stroke-width="1"/>
<rect x="628.60" y="250" width="4" height="22" fill="#ffffff"/>
<text x="720.0" y="266.0" class="sml" text-anchor="start">Sₙ = 21/16</text>
<text x="850.0" y="266.0" class="sml" text-anchor="start" fill="#ffcb6b">gap = 1/48</text>
<text x="52.0" y="314.0" class="lbl" text-anchor="start">n = 3</text>
<rect x="648.80" y="298" width="6.73" height="22" fill="#00adb5" fill-opacity="0.55" stroke="#00adb5" stroke-width="1"/>
<rect x="648.80" y="298" width="4" height="22" fill="#ffffff"/>
<text x="720.0" y="314.0" class="sml" text-anchor="start">Sₙ = 85/64</text>
<text x="850.0" y="314.0" class="sml" text-anchor="start" fill="#ffcb6b">gap = 1/192</text>
<text x="52.0" y="362.0" class="lbl" text-anchor="start">n = 4</text>
<rect x="653.85" y="346" width="1.68" height="22" fill="#00adb5" fill-opacity="0.55" stroke="#00adb5" stroke-width="1"/>
<rect x="653.85" y="346" width="4" height="22" fill="#ffffff"/>
<text x="720.0" y="362.0" class="sml" text-anchor="start">Sₙ = 341/256</text>
<text x="850.0" y="362.0" class="sml" text-anchor="start" fill="#ffcb6b">gap = 1/768</text>
<text x="52.0" y="410.0" class="lbl" text-anchor="start">n = 5</text>
<rect x="655.11" y="394" width="0.42" height="22" fill="#00adb5" fill-opacity="0.55" stroke="#00adb5" stroke-width="1"/>
<rect x="655.11" y="394" width="4" height="22" fill="#ffffff"/>
<text x="720.0" y="410.0" class="sml" text-anchor="start">Sₙ = 1365/1024</text>
<text x="850.0" y="410.0" class="sml" text-anchor="start" fill="#ffcb6b">gap = 1/3072</text>
<text x="32.0" y="42.0" class="ttl" text-anchor="start">The squeeze, from below</text>
<text x="32.0" y="70.0" class="sub" text-anchor="start">Every finite inscribed sum Sₙ lies below K = 4T/3, and the gap is exactly T/(3·4ⁿ).</text>
</svg>
