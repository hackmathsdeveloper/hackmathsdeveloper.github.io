<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Auxiliary triangle four times the inscribed triangle</title>
<desc id="dsc">The triangle ADB formed by the chord, the axis-parallel through A, and the tangent at B, containing four copies of the area of triangle APB.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b9c4d8"/></marker>
