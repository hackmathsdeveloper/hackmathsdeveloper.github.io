<text x="755.0" y="136.0" class="eq" text-anchor="middle" font-size="19">A_cap = 2πrh</text>
<text x="755.0" y="174.0" class="eq" text-anchor="middle" font-size="18">V_cap = πh²(r − h/3)</text>
<text x="755.0" y="210.0" class="sml" text-anchor="middle">h = height of the cap</text>
<text x="755.0" y="234.0" class="sml" text-anchor="middle" fill="#00adb5">base radius = √(2rh − h²)</text>
<text x="32.0" y="44.0" class="ttl" text-anchor="start">A spherical cap</text>
<text x="32.0" y="72.0" class="sub" text-anchor="start">The cap's area depends only on its height h, not on where it is cut from the sphere.</text>
