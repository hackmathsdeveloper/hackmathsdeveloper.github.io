<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Sphere inscribed in a cylinder</title>
<desc id="dsc">A circle of radius r inside the square of side 2r, representing the sphere inside its circumscribing cylinder, with the 2 to 3 ratios.</desc>
