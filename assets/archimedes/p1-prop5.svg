<text x="32.0" y="40.0" class="ttl" text-anchor="start">Proposition 5 — a transverse line through the enclosing triangle</text>
<text x="32.0" y="66.0" class="sub" text-anchor="start">The parabola divides the axis-parallel section QL in the same ratio as the chord is divided at K.</text>
<text x="32.0" y="90.0" class="eq" text-anchor="start" font-size="16">For this K:  AK/KB = QK/LQ = 7/3.</text>
