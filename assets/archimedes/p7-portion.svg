<title id="ttl">Centroid of a parabolic portion between parallel chords</title>
<desc id="dsc">A parabolic region cut between the chords y equals 1 and y equals 4, with the diameter, the middle fifth between P and Q, and the centroid G dividing it in the ratio 16 to 5.</desc>
