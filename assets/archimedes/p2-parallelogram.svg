<text x="32.0" y="44.0" class="ttl" text-anchor="start">Why the first triangle removes more than half</text>
<text x="32.0" y="72.0" class="sub" text-anchor="start">The segment sits strictly inside a rectangle of area 2T, so S &lt; 2T and the triangle T exceeds half the segment.</text>
<text x="450.0" y="536.0" class="eq" text-anchor="middle" font-size="20">S &lt; 2T   ⇒   T &gt; S/2</text>
