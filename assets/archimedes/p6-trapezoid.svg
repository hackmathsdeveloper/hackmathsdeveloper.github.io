<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Trapezium centroid on the midline</title>
<desc id="dsc">A trapezium with parallel sides 6 and 3 and height 4, its midline, and the centroid dividing the midline in the ratio 5 to 4.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b9c4d8"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#00adb5"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#f07178"/></marker>
  <marker id="dim" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,4 L7,4" stroke="#b9c4d8" stroke-width="1.4"/></marker>
  <pattern id="hatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="9" stroke="#f07178" stroke-width="2.2" opacity="0.55"/>
  </pattern>
  <style>
    text { font-family: 'Source Sans Pro','Helvetica Neue',Arial,sans-serif; fill: #eaeaea; }
    .ttl { font-size: 20px; font-weight: 600; fill: #ffffff; }
    .sub { font-size: 14px; fill: #b9c4d8; }
    .lbl { font-size: 17px; fill: #eaeaea; }
    .sml { font-size: 14px; fill: #b9c4d8; }
    .eq  { font-size: 17px; fill: #ffcb6b; }
    .axis { stroke: #7c89a6; stroke-width: 1.5; fill: none; }
    .grid { stroke: #3a455c; stroke-width: 1; fill: none; }
    .curve { stroke: #00adb5; stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .curve2 { stroke: #f78c6c; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .curve3 { stroke: #82aaff; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: #eaeaea; stroke-width: 1.5; fill: none; stroke-linejoin: round; }
    .thin2 { stroke: #b9c4d8; stroke-width: 1.2; fill: none; }
    .dash { stroke-dasharray: 7 6; }
    .dotdash { stroke-dasharray: 2 6; }
    .fill-teal { fill: #00adb5; fill-opacity: 0.16; }
    .fill-orange { fill: #f78c6c; fill-opacity: 0.15; }
    .fill-blue { fill: #82aaff; fill-opacity: 0.12; }
    .fill-purple { fill: #c792ea; fill-opacity: 0.14; }
    .fill-green { fill: #c3e88d; fill-opacity: 0.12; }
    .fill-red { fill: #f07178; fill-opacity: 0.12; }
    .pt { fill: #eaeaea; }
    .pt-teal { fill: #00adb5; }
    .pt-orange { fill: #f78c6c; }
    .box { fill: #1f2430; stroke: #3a455c; stroke-width: 1.2; }
  </style>
</defs>
<rect x="0" y="0" width="900" height="580" rx="14" fill="#252a34"/>
<path d="M 210.00,460.00 L 690.00,460.00 L 570.00,140.00 L 330.00,140.00 Z" class="fill-teal"/>
<path d="M 210.00,460.00 L 690.00,460.00 L 570.00,140.00 L 330.00,140.00 Z" class="thin"/>
<line x1="450.0" y1="460.0" x2="450.0" y2="140.0" class="curve2"/>
<circle cx="450.0" cy="460.0" r="3.4" class="pt"/>
<circle cx="450.0" cy="140.0" r="3.4" class="pt"/>
<circle cx="450.0" cy="317.8" r="4.6" class="pt-orange"/>
<text x="200.0" y="478.0" class="sml" text-anchor="end">A</text>
<text x="700.0" y="478.0" class="sml" text-anchor="start">B</text>
<text x="580.0" y="132.0" class="sml" text-anchor="start">C</text>
<text x="320.0" y="132.0" class="sml" text-anchor="end">D</text>
<text x="458.0" y="478.0" class="sml" text-anchor="start">M_B</text>
<text x="458.0" y="132.0" class="sml" text-anchor="start">M_b</text>
<text x="460.0" y="322.8" class="lbl" text-anchor="start" fill="#f78c6c">G</text>
<text x="460.0" y="286.0" class="eq" text-anchor="start" fill="#f78c6c">5</text>
<text x="460.0" y="393.9" class="eq" text-anchor="start" fill="#00adb5">4</text>
<line x1="210.0" y1="480.0" x2="690.0" y2="480.0" class="thin2"/>
<line x1="210.0" y1="480.0" x2="210.0" y2="480.0" class="thin2 dash"/>
<line x1="690.0" y1="480.0" x2="690.0" y2="480.0" class="thin2 dash"/>
<text x="450.0" y="472.0" class="sml" text-anchor="middle">B = 6</text>
<line x1="330.0" y1="116.0" x2="570.0" y2="116.0" class="thin2"/>
<line x1="330.0" y1="116.0" x2="330.0" y2="116.0" class="thin2 dash"/>
<line x1="570.0" y1="116.0" x2="570.0" y2="116.0" class="thin2 dash"/>
<text x="450.0" y="108.0" class="sml" text-anchor="middle">b = 3</text>
<text x="450.0" y="545.0" class="eq" text-anchor="middle" font-size="20">M_bG : GM_B = 5 : 4</text>
<text x="32.0" y="44.0" class="ttl" text-anchor="start">The centre of gravity of a trapezium</text>
<text x="32.0" y="72.0" class="sub" text-anchor="start">The centroid lies on the midline joining the parallel sides, closer to the larger base.</text>
</svg>
