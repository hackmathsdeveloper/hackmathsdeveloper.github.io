<title id="ttl">Trisecting a sixty degree angle with an Archimedean spiral</title>
<desc id="dsc">An Archimedean spiral with rays at zero, twenty, and sixty degrees, the radius OP divided into three equal parts, and the circle of radius r over three meeting the spiral at twenty degrees.</desc>
