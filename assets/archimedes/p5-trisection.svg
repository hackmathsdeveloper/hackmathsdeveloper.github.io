<text x="32.0" y="44.0" class="ttl" text-anchor="start">Trisecting 60° with a spiral</text>
<text x="32.0" y="72.0" class="sub" text-anchor="start">Divide OP into three equal parts, draw the circle of radius r/3, and meet the spiral: the ray to Q is at 20°.</text>
