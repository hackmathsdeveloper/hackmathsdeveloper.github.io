<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Inscribed and circumscribed surface areas approaching four pi R squared</title>
<desc id="dsc">Two curves plotting the inscribed and circumscribed polygonal surface areas divided by 4 pi R squared against the number of polygon sides; both converge to 1.</desc>
