<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Tangent construction giving a straight segment equal to the circumference</title>
<desc id="dsc">Left: a right triangle OPT with OP equal to d and OT equal to 2 pi d. Right: the first turn of the spiral with the tangent at P.</desc>
